[project]
name = "spicesminsk"
version = "0.1.0"
description = "Каталог специй в Минске"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=5.1,<6",
    "gunicorn>=26.0.0",
    "pillow>=10",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.2.2",
    "sentry-sdk>=2.0",
    "unidecode>=1.4.0",
]

[tool.django]
settings = "spicesminsk.settings"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-django>=4.12.0",
    "ruff>=0.11.0",
    "pyright>=1.1.400",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "spicesminsk.settings"
testpaths = ["catalog/tests"]
python_files = ["test_*.py"]

[project.scripts]
test = "pytest:main"
